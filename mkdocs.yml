site_name: Claude Code for Social Scientists
site_description: >-
  A bilingual Turkish and English curriculum, skill library, safe installer, and
  Social Scientist Agent for social scientists using Claude Code and Codex.
site_url: https://onourimpram.github.io/claude-code-for-social-scientists/
repo_url: https://github.com/OnourImpram/claude-code-for-social-scientists
repo_name: OnourImpram/claude-code-for-social-scientists
copyright: >-
  Code: Apache-2.0 · Prose and booklets: CC-BY-NC-SA-4.0 ·
  © 2026 Onour Impram (ORCID 0000-0003-1076-3928)

docs_dir: .
site_dir: _site

exclude_docs: |
  _site/
  web/
  node_modules/
  .git/
  .github/
  .claude/
  .claude-plugin/
  .agents/
  agents/
  core/
  examples/
  src/
  scripts/
  template/
  meta/
  tests/
  paper/
  provenance/
  assets/*.json
  assets/*.svg
  package.json
  package-lock.json
  pyproject.toml
  LICENSE
  LICENSING.md
  SECURITY.md
  CODE_OF_CONDUCT.md
  CONTRIBUTING.tr.md
  README.tr.md
  AI-AUTHORSHIP.md
  CHANGELOG.md
  AGENTS.md
  mkdocs.yml

theme:
  name: material
  language: en
  # Self-hosted fonts via assets/extra.css. Material must not fetch Google Fonts.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

plugins:
  - same-dir
  - search:
      lang:
        - en
        - tr

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

