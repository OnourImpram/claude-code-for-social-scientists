name: PR Mypy Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remediate:
    if: github.head_ref == 'upgrade/social-scientist-dual-client-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: upgrade/social-scientist-dual-client-agent
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff mypy build

      - name: Apply type contract corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/social_cc_plugin/cli.py')
          source_text = source.read_text(encoding='utf-8')
          old_import = 'from collections.abc import Iterator'
          new_import = 'from collections.abc import Iterator, Mapping'
          old_tools = '    tools: dict[str, str | None],'
          new_tools = '    tools: Mapping[str, str | None],'
          if source_text.count(old_import) != 1:
              raise SystemExit('expected one Iterator import')
          if source_text.count(old_tools) != 1:
              raise SystemExit('expected one doctor_report tools annotation')
          source_text = source_text.replace(old_import, new_import, 1)
          source_text = source_text.replace(old_tools, new_tools, 1)
          source.write_text(source_text, encoding='utf-8')

          tests = Path('tests/test_cli.py')
          test_text = tests.read_text(encoding='utf-8')
          old_patch = 'monkeypatch.setattr(cli.Path, "home", classmethod(lambda cls: tmp_path))'
          new_patch = 'monkeypatch.setattr(Path, "home", classmethod(lambda cls: tmp_path))'
          if test_text.count(old_patch) != 1:
              raise SystemExit('expected one internal cli.Path monkeypatch')
          tests.write_text(test_text.replace(old_patch, new_patch, 1), encoding='utf-8')

          Path('.github/workflows/pr-mypy-remediation.yml').unlink()
          PY

      - name: Verify corrected type contracts
        run: |
          python -m pytest tests/ -q
          ruff check .
          mypy --strict src tests

      - name: Commit and push corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/social_cc_plugin/cli.py \
            tests/test_cli.py \
            .github/workflows/pr-mypy-remediation.yml
          git commit -m "fix: satisfy strict installer type contracts"
          git push origin HEAD:upgrade/social-scientist-dual-client-agent
