<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" role="img"
     aria-label="Terminal recording of npm run check-dois in the Claude Code for Social Scientists repository. The DOI liveness checker resolves 142 unique DOIs against doi.org and reports 142 alive, 0 transient or unverified, and 0 dead.">
