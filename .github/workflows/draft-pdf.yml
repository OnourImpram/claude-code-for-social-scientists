name: Draft paper PDF

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Compile JOSE paper draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # master 2026-07-16
        with:
          journal: jose
          paper-path: paper/paper.md

      - name: Upload paper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
