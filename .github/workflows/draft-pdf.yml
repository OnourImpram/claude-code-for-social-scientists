name: Draft paper PDF

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Compile JOSE paper draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # master 2026-07-16
        with:
          journal: jose
          paper-path: paper/paper.md

      - name: Upload paper artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pdf
          path: paper/paper.pdf
