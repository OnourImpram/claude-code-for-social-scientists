name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITLEAKS_VERSION}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          archive="gitleaks_${ver}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL "${base}/${archive}" -o "${tmp}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL "${base}/gitleaks_${ver}_checksums.txt" -o "${tmp}/checksums.txt"
          (
            cd "${tmp}"
            grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          )
          tar -xzf "${tmp}/${archive}" -C "${tmp}" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --no-git --redact --verbose --exit-code 1

      - name: Scan full git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --verbose --exit-code 1
