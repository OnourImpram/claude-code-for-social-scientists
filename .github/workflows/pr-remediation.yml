name: PR Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DISABLE_MKDOCS_2_WARNING: true

jobs:
  remediate:
    if: github.head_ref == 'upgrade/social-scientist-dual-client-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: upgrade/social-scientist-dual-client-agent
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -e . pytest mkdocs-material mkdocs-same-dir

      - name: Apply bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-platform.mjs')
          validator_lines = validator.read_text(encoding='utf-8').splitlines()
          matches = 0
          for index, line in enumerate(validator_lines):
              if 'scalar[2].trim().replace(' in line:
                  validator_lines[index] = "      scalar[2].trim().replace(/^['\"]|['\"]$/gu, \"\"),"
                  matches += 1
          if matches != 1:
              raise SystemExit(f'expected one frontmatter quote normalizer, found {matches}')
          validator.write_text('\n'.join(validator_lines) + '\n', encoding='utf-8')

          for name in (
              'core/agents/social-scientist.md',
              '.claude/agents/social-scientist.md',
              'agents/social-scientist.md',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              replacements = (
                  ('1. Association into causation.', '1. association into causation.'),
                  (
                      '4. Qualitative frequency into population prevalence.',
                      '4. qualitative frequency into population prevalence.',
                  ),
              )
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'expected agent boundary not found in {name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          old_license = (
              'See [`LICENSE`](./LICENSE), [`LICENSE.code`](./LICENSE.code), and '
              '[`LICENSE.content`](./LICENSE.content).'
          )
          new_license = (
              'See [`LICENSE`](./LICENSE), <a href="./LICENSE.code">LICENSE.code</a>, and '
              '<a href="./LICENSE.content">LICENSE.content</a>.'
          )
          old_citation = 'Use the machine readable record in [`CITATION.cff`](./CITATION.cff)'
          new_citation = (
              'Use the machine readable record in '
              '<a href="./CITATION.cff">CITATION.cff</a>'
          )
          if old_license not in readme_text or old_citation not in readme_text:
              raise SystemExit('expected README repository artifact links were not found')
          readme_text = readme_text.replace(old_license, new_license, 1)
          readme_text = readme_text.replace(old_citation, new_citation, 1)
          readme.write_text(readme_text, encoding='utf-8')

          Path('.github/workflows/pr-remediation.yml').unlink()
          PY

      - name: Verify corrected sources
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/validate-platform.mjs
          node scripts/validate-platform.mjs
          python -m pytest tests/ -q
          mkdocs build --strict

      - name: Commit and push corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-platform.mjs \
            core/agents/social-scientist.md \
            .claude/agents/social-scientist.md \
            agents/social-scientist.md \
            README.md \
            .github/workflows/pr-remediation.yml
          git commit -m "fix: close remaining platform and documentation gates"
          git push origin HEAD:upgrade/social-scientist-dual-client-agent
