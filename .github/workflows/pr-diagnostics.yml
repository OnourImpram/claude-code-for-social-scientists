name: PR Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostics:
    if: github.head_ref == 'upgrade/social-scientist-dual-client-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff mypy build

      - name: Run diagnostics and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          lint_status=$?
          npm run validate > /tmp/validate.log 2>&1
          validate_status=$?
          python -m pytest tests/ -q > /tmp/pytest.log 2>&1
          pytest_status=$?

          {
            echo '<!-- social-cc-pr-diagnostics -->'
            echo '## Automated diagnostic summary'
            echo
            echo "- markdownlint exit: ${lint_status}"
            echo "- repository validator exit: ${validate_status}"
            echo "- pytest exit: ${pytest_status}"
            echo
            echo '<details><summary>markdownlint tail</summary>'
            echo
            echo '```text'
            tail -n 120 /tmp/lint.log
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>repository validator tail</summary>'
            echo
            echo '```text'
            tail -n 120 /tmp/validate.log
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>pytest tail</summary>'
            echo
            echo '```text'
            tail -n 160 /tmp/pytest.log
            echo '```'
            echo '</details>'
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
